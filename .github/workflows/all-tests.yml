name: Automated Testing Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  run-all-tests:
    name: Run All 4 Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Project Dependencies
        run: |
          npm install
          npm install -g http-server

      - name: Install Selenium Dependencies
        working-directory: ./selenium-tests
        run: npm install

      - name: Install Appium Dependencies
        working-directory: ./appium-tests
        run: npm install

      - name: Start Servers (Backend & Frontend)
        run: |
          # Start backend server on port 3001
          node server.js &
          
          # Start frontend on port 8080
          http-server -p 8080 &
          
          # Wait for servers to be up
          sleep 5

      # ──────────────────────────────────────────
      # TEST 1: Security Assessment
      # ──────────────────────────────────────────
      - name: Run Security Assessment (Test 1)
        continue-on-error: true
        run: |
          echo "Running security assessment..."
          node generate-security-report.js

      # ──────────────────────────────────────────
      # TEST 2: Load Testing
      # ──────────────────────────────────────────
      - name: Run Baseline Load Test (Test 2)
        continue-on-error: true
        run: |
          echo "Running load test..."
          node load-test.js

      # ──────────────────────────────────────────
      # TEST 3: Selenium E2E Tests
      # ──────────────────────────────────────────
      - name: Run Selenium E2E Tests (Test 3)
        continue-on-error: true
        working-directory: ./selenium-tests
        run: |
          echo "Running Selenium tests..."
          # Install xvfb to run Chrome without a display
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum node tests/login-tests.js

      # ──────────────────────────────────────────
      # TEST 4: Appium Mobile Tests
      # ──────────────────────────────────────────
      - name: Run Appium Mobile Tests (Test 4)
        continue-on-error: true
        working-directory: ./appium-tests
        run: |
          echo "Running Appium tests..."
          # Note: Without a real emulator in the CI runner, this may exit early.
          # It is included as part of the 4 requested tests.
          node app-tests.js

      # ──────────────────────────────────────────
      # UPLOAD ARTIFACTS
      # ──────────────────────────────────────────
      - name: Upload Excel Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-test-excel-reports
          path: |
            Vulnerability Test Results/*.xlsx
            load-test-results/*.xlsx
            selenium-tests/TestSummary.xlsx
            appium-tests/AppiumTestSummary.xlsx
          retention-days: 14
